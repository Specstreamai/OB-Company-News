tool: seltz
setups:
  seltz_news:
    class: main
    pricing:
      list_usd: 0.005
      basis: list
  seltz_web:
    class: main
    settings:
      scope: web
    pricing:
      list_usd: 0.005
      basis: list
  # Same scope and result count; returns the highest-scoring passages instead of full content.
  seltz_web_snippets:
    class: main
    settings:
      scope: web
      snippets: true
    pricing:
      list_usd: 0.005
      basis: list
